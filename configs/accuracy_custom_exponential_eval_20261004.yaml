models:
- custom
datasets:
- MNIST
- NMNIST
- CIFAR10DVS
- DVSGesture
homeostasis_modes:
- exponential
weight_bits:
- 2
- 4
hidden_widths:
- 4096
- 4096
learning_rules:
- stdp
- bp
custom_channels:
- 64
- 128
- 256
- 320
- 512
- 1024
- 1024
